[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-red-teaming-test-harness"
version = "1.0.0"
description = "A safe local framework for validating and running structured AI red teaming test cases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Sameer" }]
dependencies = [
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.0,<15.0",
  "openai>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.0,<10.0"
]

[project.urls]
Homepage = "https://github.com/sameerrajput99/AI-Red-Teaming-Test-Harness"
Repository = "https://github.com/sameerrajput99/AI-Red-Teaming-Test-Harness.git"
Issues = "https://github.com/sameerrajput99/AI-Red-Teaming-Test-Harness/issues"

[project.scripts]
validate-ai-tests = "ai_red_teaming_harness.validate_cases:main"
run-ai-tests = "ai_red_teaming_harness.run_cases:main"
evaluate-ai-tests = "ai_red_teaming_harness.evaluate_cases:main"
report-ai-tests = "ai_red_teaming_harness.report_cases:main"
compare-ai-tests = "ai_red_teaming_harness.compare_cases:main"
gate-ai-tests = "ai_red_teaming_harness.gate_cases:main"
check-ai-provider = "ai_red_teaming_harness.provider_check:main"
stability-ai-tests = "ai_red_teaming_harness.stability_cases:main"
risk-ai-tests = "ai_red_teaming_harness.risk_cases:main"
findings-ai-tests = "ai_red_teaming_harness.findings_cases:main"
assessment-ai-tests = "ai_red_teaming_harness.assessment_cases:main"
e2e-ai-tests = "ai_red_teaming_harness.e2e_cases:main"
showcase-ai-security = "ai_red_teaming_harness.showcase_cases:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
